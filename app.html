<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bybit Trading Bot - Real-time Analysis</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #16181d;
      --bg-card: #1e2329;
      --border: #2b3139;
      --text-primary: #eaecef;
      --text-secondary: #848e9c;
      --success: #0ecb81;
      --danger: #f6465d;
      --warning: #fcd535;
      --info: #3861fb;
      --accent: #f0b90b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1920px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-badge.active {
      background: rgba(14, 203, 129, 0.1);
      color: var(--success);
    }

    .status-badge.inactive {
      background: rgba(246, 70, 93, 0.1);
      color: var(--danger);
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 500;
    }

    select, input, button {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    select:hover, input:hover {
      border-color: var(--accent);
    }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1);
    }

    button {
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-primary);
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-success {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    button.btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-success {
      background: rgba(14, 203, 129, 0.1);
      color: var(--success);
    }

    .badge-danger {
      background: rgba(246, 70, 93, 0.1);
      color: var(--danger);
    }

    .badge-warning {
      background: rgba(252, 213, 53, 0.1);
      color: var(--warning);
    }

    .badge-info {
      background: rgba(56, 97, 251, 0.1);
      color: var(--info);
    }

    /* Price Display */
    .price-display {
      font-size: 32px;
      font-weight: 700;
      margin: 10px 0;
    }

    .price-change {
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price-change.positive {
      color: var(--success);
    }

    .price-change.negative {
      color: var(--danger);
    }

    /* Indicators */
    .indicator-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .indicator {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .indicator-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 500;
    }

    .indicator-value {
      font-size: 18px;
      font-weight: 600;
    }

    .indicator-signal {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
      margin-top: 5px;
    }

    /* Chart Container */
    .chart-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      height: 500px;
    }

    canvas {
      max-height: 100%;
    }

    /* Strategy Signals */
    .strategy-signals {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .signal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
    }

    .signal-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1);
    }

    .signal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .signal-name {
      font-size: 14px;
      font-weight: 600;
    }

    .confidence-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .signal-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .signal-detail {
      font-size: 12px;
    }

    .signal-detail-label {
      color: var(--text-secondary);
    }

    .signal-detail-value {
      font-weight: 600;
      margin-left: 5px;
    }

    /* Loading */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Logs */
    .logs {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .log-entry {
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: var(--text-secondary);
    }

    .log-success {
      color: var(--success);
    }

    .log-error {
      color: var(--danger);
    }

    .log-info {
      color: var(--info);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        width: 100%;
      }

      .control-group {
        flex: 1;
      }

      .indicator-grid {
        grid-template-columns: 1fr;
      }

      .chart-container {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <h1>
          🤖 Bybit Trading Bot
        </h1>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <span class="status-badge active" id="statusBadge">
            <span class="pulse"></span>
            Đang hoạt động
          </span>
        </div>
      </div>

      <div class="controls">
        <div class="control-group">
          <label>Trading Pair</label>
          <select id="symbolSelect">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="SOLUSDT">SOL/USDT</option>
            <option value="BNBUSDT">BNB/USDT</option>
            <option value="XRPUSDT">XRP/USDT</option>
          </select>
        </div>

        <div class="control-group">
          <label>Timeframe</label>
          <select id="timeframeSelect">
            <option value="1">1m</option>
            <option value="5">5m</option>
            <option value="15" selected>15m</option>
            <option value="60">1h</option>
            <option value="240">4h</option>
            <option value="D">1D</option>
          </select>
        </div>

        <div class="control-group">
          <label>&nbsp;</label>
          <button id="startBtn" class="btn-success">
            ▶ Start
          </button>
        </div>

        <div class="control-group">
          <label>&nbsp;</label>
          <button id="stopBtn" class="btn-danger" disabled>
            ⏸ Stop
          </button>
        </div>
      </div>
    </div>

    <!-- Price Info -->
    <div class="grid">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Giá hiện tại</span>
          <span class="card-badge badge-info" id="lastUpdate">--</span>
        </div>
        <div class="price-display" id="currentPrice">$0.00</div>
        <div class="price-change" id="priceChange">
          <span>--</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">RSI (14)</span>
        </div>
        <div class="indicator">
          <div class="indicator-value" id="rsiValue">--</div>
          <div class="indicator-signal badge-info" id="rsiSignal">--</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">MACD</span>
        </div>
        <div class="indicator-grid">
          <div class="indicator">
            <div class="indicator-label">MACD</div>
            <div class="indicator-value" id="macdValue">--</div>
          </div>
          <div class="indicator">
            <div class="indicator-label">Signal</div>
            <div class="indicator-value" id="macdSignal">--</div>
          </div>
        </div>
        <div class="indicator-signal badge-info" id="macdTrend">--</div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Bollinger Bands</span>
        </div>
        <div class="indicator-grid">
          <div class="indicator">
            <div class="indicator-label">Upper</div>
            <div class="indicator-value" id="bbUpper">--</div>
          </div>
          <div class="indicator">
            <div class="indicator-label">Lower</div>
            <div class="indicator-value" id="bbLower">--</div>
          </div>
        </div>
        <div class="indicator-signal badge-info" id="bbSignal">--</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-container">
      <canvas id="priceChart"></canvas>
    </div>

    <!-- Strategy Signals -->
    <div class="grid">
      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-header">
          <span class="card-title">📊 Tín hiệu chiến lược</span>
          <button id="refreshBtn">🔄 Refresh</button>
        </div>
        <div class="strategy-signals" id="strategySignals">
          <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
            Nhấn Start để bắt đầu phân tích...
          </div>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📝 Logs</span>
        <button id="clearLogsBtn">Clear</button>
      </div>
      <div class="logs" id="logs"></div>
    </div>
  </div>

  <script>
    // Configuration
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000'
      : window.location.origin;

    let chart = null;
    let updateInterval = null;
    let isRunning = false;
    let ws = null;

    // DOM Elements
    const elements = {
      symbolSelect: document.getElementById('symbolSelect'),
      timeframeSelect: document.getElementById('timeframeSelect'),
      startBtn: document.getElementById('startBtn'),
      stopBtn: document.getElementById('stopBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      clearLogsBtn: document.getElementById('clearLogsBtn'),
      statusBadge: document.getElementById('statusBadge'),
      currentPrice: document.getElementById('currentPrice'),
      priceChange: document.getElementById('priceChange'),
      lastUpdate: document.getElementById('lastUpdate'),
      rsiValue: document.getElementById('rsiValue'),
      rsiSignal: document.getElementById('rsiSignal'),
      macdValue: document.getElementById('macdValue'),
      macdSignal: document.getElementById('macdSignal'),
      macdTrend: document.getElementById('macdTrend'),
      bbUpper: document.getElementById('bbUpper'),
      bbLower: document.getElementById('bbLower'),
      bbSignal: document.getElementById('bbSignal'),
      strategySignals: document.getElementById('strategySignals'),
      logs: document.getElementById('logs')
    };

    // Initialize Chart
    function initChart() {
      const ctx = document.getElementById('priceChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Price',
              data: [],
              borderColor: '#f0b90b',
              backgroundColor: 'rgba(240, 185, 11, 0.1)',
              borderWidth: 2,
              tension: 0.4,
              fill: true
            },
            {
              label: 'EMA 50',
              data: [],
              borderColor: '#0ecb81',
              borderWidth: 2,
              tension: 0.4,
              fill: false,
              pointRadius: 0
            },
            {
              label: 'EMA 200',
              data: [],
              borderColor: '#f6465d',
              borderWidth: 2,
              tension: 0.4,
              fill: false,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                color: '#eaecef'
              }
            },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: '#1e2329',
              titleColor: '#eaecef',
              bodyColor: '#eaecef',
              borderColor: '#2b3139',
              borderWidth: 1
            }
          },
          scales: {
            x: {
              grid: {
                color: '#2b3139'
              },
              ticks: {
                color: '#848e9c'
              }
            },
            y: {
              grid: {
                color: '#2b3139'
              },
              ticks: {
                color: '#848e9c'
              }
            }
          }
        }
      });
    }

    // Add log entry
    function addLog(message, type = 'info') {
      const time = new Date().toLocaleTimeString('vi-VN');
      const logClass = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : 'log-info';

      const logEntry = document.createElement('div');
      logEntry.className = 'log-entry';
      logEntry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${logClass}">${message}</span>`;

      elements.logs.insertBefore(logEntry, elements.logs.firstChild);

      // Limit to 100 logs
      while (elements.logs.children.length > 100) {
        elements.logs.removeChild(elements.logs.lastChild);
      }
    }

    // Fetch market data
    async function fetchMarketData() {
      try {
        const symbol = elements.symbolSelect.value;
        const interval = elements.timeframeSelect.value;

        addLog(`Đang tải dữ liệu ${symbol} - ${interval}m...`);

        const response = await fetch(`${API_URL}/api/bybit/klines?symbol=${symbol}&interval=${interval}&limit=200`);
        const data = await response.json();

        if (data.retCode !== 0) {
          throw new Error(data.retMsg || 'Failed to fetch data');
        }

        const klines = data.result.list.reverse();
        return klines;

      } catch (error) {
        addLog(`Lỗi: ${error.message}`, 'error');
        console.error('Error fetching market data:', error);
        return null;
      }
    }

    // Update chart with market data
    function updateChart(klines) {
      if (!klines || klines.length === 0) return;

      const labels = klines.map(k => new Date(parseInt(k[0])).toLocaleTimeString('vi-VN', {
        hour: '2-digit',
        minute: '2-digit'
      }));

      const prices = klines.map(k => parseFloat(k[4]));

      chart.data.labels = labels;
      chart.data.datasets[0].data = prices;

      chart.update('none');
    }

    // Analyze strategy
    async function analyzeStrategy() {
      try {
        const symbol = elements.symbolSelect.value;
        const timeframe = elements.timeframeSelect.value;

        const response = await fetch(`${API_URL}/api/strategy/analyze`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            symbol,
            timeframe,
            strategies: ['ALL']
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        // Update indicators
        updateIndicators(data.marketIndicators);

        // Update strategy signals
        updateStrategySignals(data.signals, data.bestSignal);

        // Update price
        updatePrice(data.currentPrice);

        addLog(`Phân tích hoàn tất - Tín hiệu: ${data.bestSignal.signal}`, 'success');

        return data;

      } catch (error) {
        addLog(`Lỗi phân tích: ${error.message}`, 'error');
        console.error('Error analyzing strategy:', error);
        return null;
      }
    }

    // Update price display
    function updatePrice(price) {
      elements.currentPrice.textContent = `$${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      elements.lastUpdate.textContent = new Date().toLocaleTimeString('vi-VN');
    }

    // Update indicators
    function updateIndicators(indicators) {
      // RSI
      if (indicators.rsi) {
        elements.rsiValue.textContent = indicators.rsi.current.toFixed(2);
        elements.rsiSignal.textContent = indicators.rsi.signal;
        elements.rsiSignal.className = `indicator-signal ${getSignalClass(indicators.rsi.signal)}`;
      }

      // MACD
      if (indicators.macd) {
        elements.macdValue.textContent = indicators.macd.macd.toFixed(2);
        elements.macdSignal.textContent = indicators.macd.signal.toFixed(2);
        elements.macdTrend.textContent = indicators.macd.trend;
        elements.macdTrend.className = `indicator-signal ${getSignalClass(indicators.macd.trend)}`;
      }

      // Bollinger Bands
      if (indicators.bollingerBands) {
        elements.bbUpper.textContent = indicators.bollingerBands.upper.toFixed(2);
        elements.bbLower.textContent = indicators.bollingerBands.lower.toFixed(2);
        elements.bbSignal.textContent = indicators.bollingerBands.signal;
        elements.bbSignal.className = `indicator-signal ${getSignalClass(indicators.bollingerBands.signal)}`;
      }

      // Update EMA lines in chart
      if (indicators.ema50 && indicators.ema200) {
        // This would require storing EMA values for all data points
        // For simplicity, we'll skip this in this version
      }
    }

    // Update strategy signals
    function updateStrategySignals(signals, bestSignal) {
      elements.strategySignals.innerHTML = '';

      signals.forEach(signal => {
        const isBest = signal.strategy === bestSignal.strategy;

        const signalCard = document.createElement('div');
        signalCard.className = `signal-card ${isBest ? 'active' : ''}`;

        signalCard.innerHTML = `
          <div class="signal-header">
            <div class="signal-name">${getStrategyName(signal.strategy)}</div>
            <div class="confidence-badge ${getConfidenceClass(signal.confidence)}">
              ${signal.confidence.toFixed(1)}% confidence
            </div>
          </div>
          <div style="font-size: 20px; font-weight: 700; margin: 10px 0; color: ${getSignalColor(signal.signal)}">
            ${signal.signal}
          </div>
          <div class="signal-details">
            ${Object.entries(signal.indicators).map(([key, value]) => `
              <div class="signal-detail">
                <span class="signal-detail-label">${key}:</span>
                <span class="signal-detail-value">${typeof value === 'number' ? value.toFixed(2) : value}</span>
              </div>
            `).join('')}
          </div>
        `;

        elements.strategySignals.appendChild(signalCard);
      });
    }

    // Helper functions
    function getStrategyName(strategy) {
      const names = {
        'EMA_RSI': '📈 EMA + RSI Strategy',
        'MACD_BB': '📊 MACD + Bollinger Bands',
        'MULTI_TF': '🔄 Multi-Timeframe Trend'
      };
      return names[strategy] || strategy;
    }

    function getSignalClass(signal) {
      const signalStr = signal.toString().toUpperCase();
      if (signalStr.includes('BULLISH') || signalStr.includes('OVERSOLD')) return 'badge-success';
      if (signalStr.includes('BEARISH') || signalStr.includes('OVERBOUGHT')) return 'badge-danger';
      return 'badge-info';
    }

    function getSignalColor(signal) {
      if (signal === 'LONG') return '#0ecb81';
      if (signal === 'SHORT') return '#f6465d';
      return '#848e9c';
    }

    function getConfidenceClass(confidence) {
      if (confidence >= 80) return 'badge-success';
      if (confidence >= 60) return 'badge-warning';
      return 'badge-info';
    }

    // Start bot
    async function start() {
      if (isRunning) return;

      isRunning = true;
      elements.startBtn.disabled = true;
      elements.stopBtn.disabled = false;
      elements.statusBadge.className = 'status-badge active';
      elements.statusBadge.innerHTML = '<span class="pulse"></span> Đang hoạt động';

      addLog('Bot đã khởi động', 'success');

      // Initial fetch
      const klines = await fetchMarketData();
      if (klines) {
        updateChart(klines);
      }

      await analyzeStrategy();

      // Auto update every 30 seconds
      updateInterval = setInterval(async () => {
        if (isRunning) {
          const klines = await fetchMarketData();
          if (klines) {
            updateChart(klines);
          }
          await analyzeStrategy();
        }
      }, 30000);
    }

    // Stop bot
    function stop() {
      if (!isRunning) return;

      isRunning = false;
      elements.startBtn.disabled = false;
      elements.stopBtn.disabled = true;
      elements.statusBadge.className = 'status-badge inactive';
      elements.statusBadge.innerHTML = '<span class="pulse"></span> Đã dừng';

      if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
      }

      addLog('Bot đã dừng', 'info');
    }

    // Event listeners
    elements.startBtn.addEventListener('click', start);
    elements.stopBtn.addEventListener('click', stop);
    elements.refreshBtn.addEventListener('click', async () => {
      if (isRunning) {
        const klines = await fetchMarketData();
        if (klines) {
          updateChart(klines);
        }
        await analyzeStrategy();
      }
    });
    elements.clearLogsBtn.addEventListener('click', () => {
      elements.logs.innerHTML = '';
    });

    // Initialize
    initChart();
    addLog('Ứng dụng đã sẵn sàng. Nhấn Start để bắt đầu.', 'success');
  </script>
</body>
</html>
